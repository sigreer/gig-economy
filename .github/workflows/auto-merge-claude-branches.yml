name: Auto-merge Claude branches to main

on:
  push:
    branches:
      - 'claude/**'

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Get current branch name
        id: branch
        run: echo "branch_name=${GITHUB_REF#refs/heads/}" >> $GITHUB_OUTPUT

      - name: Merge to main
        run: |
          echo "Merging ${{ steps.branch.outputs.branch_name }} into main..."
          git fetch origin main
          git checkout main
          git merge --no-ff origin/${{ steps.branch.outputs.branch_name }} -m "Auto-merge ${{ steps.branch.outputs.branch_name }} to main"

      - name: Push to main
        run: |
          git push origin main

      - name: Notify success
        run: |
          echo "✅ Successfully merged ${{ steps.branch.outputs.branch_name }} to main"
