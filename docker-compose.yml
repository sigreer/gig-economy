version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: gig-economy-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: gigeconomy
      POSTGRES_PASSWORD: localdevpassword
      POSTGRES_DB: gigeconomy
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gigeconomy"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
